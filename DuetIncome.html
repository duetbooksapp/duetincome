<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuetIncome — Smart Retirement Comparison Tools</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/json,{%22name%22:%22Do%20It%20Income%22,%22short_name%22:%22DuetIncome%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22theme_color%22:%22%23534AB7%22,%22background_color%22:%22%23f5f5f3%22}">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pri:#534AB7;--grn:#1D9E75;--amb:#EF9F27;--dgrn:#0F6E56;--bg:#f5f5f3;--card:#fff;--ptint:#EEEDFE;--gtint:#F0FBF7;--atint:#FFFCF5;--txt:#222;--muted:#666;--border:#ddd;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08)}
body.dark-mode{--pri:#7B73E0;--grn:#2BC48E;--amb:#F5B74A;--dgrn:#25B88A;--bg:#1a1a2e;--card:#242440;--ptint:#3d3659;--gtint:#1a3a30;--atint:#3a3020;--txt:#e8e8f0;--muted:#9999aa;--border:#3a3a55;--shadow:0 1px 3px rgba(0,0,0,.3)}
body.dark-mode .topbar{background:#2d2b5e}
body.dark-mode .tabs{background:#242440;border-color:var(--border)}
body.dark-mode .tab{color:var(--muted)}
body.dark-mode .tab:hover{color:var(--pri);background:var(--ptint)}
body.dark-mode .tab.active{color:var(--pri)}
body.dark-mode input,body.dark-mode select,body.dark-mode textarea{background:#2e2e4a;color:var(--txt);border-color:var(--border)}
body.dark-mode table{color:var(--txt)}
body.dark-mode th{background:#2e2e4a!important;color:var(--txt)!important}
body.dark-mode tr:nth-child(even){background:#2a2a44}
body.dark-mode .btn-outline{color:var(--txt);border-color:var(--border)}
body.dark-mode .toast{background:#2e2e4a}
body.dark-mode td{border-bottom-color:var(--border)}
body.dark-mode tr:hover td{background:#2e2e4a}
body.dark-mode [style*="background:#fff"]{background:var(--card)!important}
body.dark-mode [style*="background: #fff"]{background:var(--card)!important}
body.dark-mode [style*="background:#f9f9f9"]{background:#2a2a44!important}
body.dark-mode [style*="background:#f5f5f3"]{background:#2a2a44!important}
body.dark-mode [style*="background:#fafafa"]{background:#2a2a44!important}
body.dark-mode [style*="background:#eee"]{background:#2e2e4a!important}
body.dark-mode [style*="background:#f5f5f5"]{background:#2a2a3a!important}
body.dark-mode [style*="background:#F0FBF7"]{background:#1a3a30!important}
body.dark-mode [style*="background:#EEEDFE"]{background:#3d3659!important}
body.dark-mode [style*="background:#FFF5F5"]{background:#3a1a1a!important}
body.dark-mode [style*="background:#fff5f5"]{background:#3a1a1a!important}
body.dark-mode [style*="background:#FFF8F0"]{background:#3a3020!important}
body.dark-mode [style*="background:#e8f5e9"]{background:#1a3a30!important}
body.dark-mode [style*="background:#fff3e0"]{background:#3a3020!important}
body.dark-mode [style*="background:#e3f2fd"]{background:#1a2a3a!important}
body.dark-mode [style*="background:#fce4ec"]{background:#3a1a1a!important}
body.dark-mode [style*="color:#333"]{color:var(--txt)!important}
body.dark-mode [style*="color:#444"]{color:var(--txt)!important}
body.dark-mode [style*="color:#555"]{color:var(--muted)!important}
body.dark-mode [style*="color:#666"]{color:var(--muted)!important}
body.dark-mode [style*="color:#999"]{color:#777788!important}
body.dark-mode [style*="border:1px solid #eee"]{border-color:var(--border)!important}
body.dark-mode [style*="border:1px solid #ddd"]{border-color:var(--border)!important}

html{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--txt)}
body{background:var(--bg);min-height:100vh}

/* ── Topbar ── */
.topbar{background:linear-gradient(135deg,#534AB7 0%,#3a32a0 100%);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.topbar-sub{font-size:11px;opacity:.7;margin-top:2px}
.topbar-right{display:flex;gap:10px;align-items:center}
.topbar-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.topbar-btn:hover{background:rgba(255,255,255,.25)}

/* ── Tabs ── */
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);overflow-x:auto;padding:0 8px;position:sticky;top:52px;z-index:90}
.tab{padding:10px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
.tab:hover{color:var(--pri);background:var(--ptint)}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}

/* ── Cards, Forms ── */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;width:100%;outline:none;transition:.2s;font-family:inherit;background:var(--card);color:var(--txt)}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(83,74,183,.15)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:.2s}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{filter:brightness(1.1)}
.btn-grn{background:var(--grn);color:#fff}.btn-grn:hover{filter:brightness(1.1)}
.btn-dgrn{background:var(--dgrn);color:#fff}.btn-dgrn:hover{filter:brightness(1.1)}
.btn-amb{background:var(--amb);color:#fff}.btn-amb:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--txt)}.btn-outline:hover{border-color:var(--pri);color:var(--pri)}
.btn-sm{padding:4px 10px;font-size:11px}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--ptint);font-weight:700;text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:7px 10px;border-bottom:1px solid #eee;vertical-align:middle}
tr:hover td{background:rgba(83,74,183,.03)}

/* ── Stat Cards ── */
.stat-card{background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-card .val{font-size:20px;font-weight:800;color:var(--pri)}
.stat-card .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ── Toast ── */
#toastBox{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);color:var(--txt);padding:12px 18px;border-radius:var(--radius);box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:13px;max-width:380px;transition:opacity .3s;border-left:4px solid var(--grn)}

/* ── Panels ── */
.panel{display:none;padding:16px;max-width:1100px;margin:0 auto}
.panel.active{display:block}

/* ── Login Screen ── */
.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#534AB7 0%,#1D9E75 100%)}
.login-card{background:#fff;border-radius:16px;padding:40px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
body.dark-mode .login-card{background:#252540;color:var(--txt)}
.login-card h1{color:var(--pri);font-size:28px;margin-bottom:4px;text-align:center}
body.dark-mode .login-card h1{color:#8B80E0}
.login-card .subtitle{color:var(--muted);font-size:13px;text-align:center;margin-bottom:30px}
.login-card label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:16px;text-transform:uppercase;letter-spacing:.5px}
.login-card input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit}
body.dark-mode .login-card input{background:#1a1a2e;color:var(--txt);border-color:var(--border)}
.login-card input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(83,74,183,.15)}
.login-btn{width:100%;padding:12px;background:var(--pri);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;margin-top:24px;transition:background .2s}
.login-btn:hover{background:#4339A0}
.login-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.login-toggle a{color:var(--pri);cursor:pointer;text-decoration:underline}
.login-error{color:#c0392b;font-size:12px;text-align:center;margin-top:12px;display:none}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block;margin-right:6px;vertical-align:middle}

/* ── Feedback Button + Modal ── */
.fb-fab{position:fixed;bottom:24px;left:24px;width:50px;height:50px;border-radius:50%;background:var(--dgrn);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25);z-index:9000;transition:transform .2s;padding:0;display:flex;align-items:center;justify-content:center}
.fb-fab:hover{transform:scale(1.08)}
.fb-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9001;display:none;justify-content:center;align-items:center;padding:20px}
.fb-modal-overlay.show{display:flex}
.fb-modal-box{background:var(--card);color:var(--txt);border-radius:12px;padding:24px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:85vh;overflow-y:auto}
.fb-item{background:var(--card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);margin-bottom:8px;border-left:4px solid var(--border)}
.fb-item.fb-bug{border-left-color:#c0392b}
.fb-item.fb-suggestion{border-left-color:var(--pri)}
.fb-item.fb-question{border-left-color:var(--amb)}
.fb-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;color:#fff}
.fb-badge-new{background:var(--amb)}
.fb-badge-reviewing{background:var(--pri)}
.fb-badge-resolved{background:var(--grn)}
.fb-badge-wontfix{background:#999}
@media(max-width:700px){.fb-fab{bottom:16px;left:16px;width:44px;height:44px;font-size:20px}}

/* ── Mobile ── */
@media(max-width:700px){
 .topbar{padding:10px 14px}
 .topbar h1{font-size:15px}
 .tabs{top:44px}
 .tab{padding:8px 12px;font-size:11px}
 .panel{padding:10px}
 table{font-size:11px}
 th,td{padding:5px 6px}
 .login-card{padding:28px 22px}
}
</style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="loginScreen" class="login-screen">
 <div class="login-card">
  <h1>DuetIncome</h1>
  <div class="subtitle">Smart Retirement Comparison Tools</div>
  <div id="loginMode">
   <label>Full Name</label>
   <input id="login_name" type="text" placeholder="First Last" autocomplete="name">
   <label>PIN</label>
   <input id="login_pin" type="password" placeholder="4-6 digit PIN" maxlength="6" inputmode="numeric">
   <button class="login-btn" onclick="doLogin()">Sign In</button>
   <div class="login-toggle">New here? <a onclick="toggleLoginMode()">Create Account</a></div>
   <div id="loginError" class="login-error"></div>
  </div>
  <div id="registerMode" style="display:none">
   <label>Full Name</label>
   <input id="reg_name" type="text" placeholder="First Last" autocomplete="name">
   <label>Branch</label>
   <input id="reg_branch" type="text" placeholder="e.g. Venice">
   <label>PIN</label>
   <input id="reg_pin" type="password" placeholder="4-6 digits" maxlength="6" inputmode="numeric">
   <label>Confirm PIN</label>
   <input id="reg_pin2" type="password" placeholder="Confirm PIN" maxlength="6" inputmode="numeric">
   <button class="login-btn" onclick="doRegister()">Create Account</button>
   <div class="login-toggle">Already have an account? <a onclick="toggleLoginMode()">Sign In</a></div>
   <div id="regError" class="login-error"></div>
  </div>
 </div>
</div>

<!-- ═══ MAIN APP (hidden until login) ═══ -->
<div id="appShell" style="display:none">

<!-- ═══ TOPBAR ═══ -->
<div class="topbar">
 <div>
  <h1>DuetIncome</h1>
  <div class="topbar-sub" id="topAgentInfo">Smart Retirement Comparison Tools</div>
 </div>
 <div class="topbar-right">
  <span id="syncLabel" style="font-size:11px;opacity:.8"><span class="sync-dot" id="syncDot"></span>Synced</span>
  <button class="topbar-btn" onclick="toggleDarkMode()" id="darkBtn">🌙</button>
  <button class="topbar-btn" onclick="doLogout()">Logout</button>
 </div>
</div>

<!-- ═══ TABS ═══ -->
<div class="tabs">
 <div class="tab active" onclick="showTab(0)">CD → Annuity</div>
 <div class="tab" onclick="showTab(1)">Annuity vs Annuity</div>
 <div class="tab" onclick="showTab(2)">S&P vs Annuity</div>
 <div class="tab" onclick="showTab(3)">Conversations</div>
</div>

<!-- ═══ PANELS ═══ -->
<div id="p0" class="panel active"></div>
<div id="p1" class="panel"></div>
<div id="p2" class="panel"></div>
<div id="p3" class="panel"></div>

<!-- ═══ FLOATING FEEDBACK BUTTON ═══ -->
<button class="fb-fab" onclick="openFeedbackModal()" title="Submit Feedback">💡</button>

<!-- ═══ FEEDBACK MODAL ═══ -->
<div id="fbModal" class="fb-modal-overlay" onclick="if(event.target===this)closeFeedbackModal()">
 <div class="fb-modal-box" id="fbModalContent"></div>
</div>

</div><!-- /appShell -->

<div id="toastBox"></div>

<script>
// ═══ CORE UTILITIES ═══
function $(s){ return document.querySelectorAll(s); }
function $1(s){ return document.querySelector(s); }
function fmt(n){ var v = Number(n); if(v < 0) return '<span style="color:#c0392b">-$' + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</span>'; return '$' + v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPlain(n){ var v = Number(n); return (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n){ return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }

function showToast(msg, dur){
 dur = dur || 10000;
 var d = document.createElement('div');
 d.className = 'toast';
 d.onclick = function(e){e.stopPropagation();};
 d.innerHTML = msg;
 document.getElementById('toastBox').appendChild(d);
 setTimeout(function(){ d.style.opacity='0'; setTimeout(function(){ d.remove(); },300); }, dur);
}

// ═══════════════════════════════════════════════════
// AUTHENTICATION + FIREBASE SYNC
// ═══════════════════════════════════════════════════
var FIREBASE_URL = 'https://duet-crm-default-rtdb.firebaseio.com/duetincome';
var currentAgent = null;

async function sha256(str){
 var buf = new TextEncoder().encode(str);
 var hash = await crypto.subtle.digest('SHA-256', buf);
 return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

function makeAgentId(name){
 return name.trim().toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
}

function fbPath(key){
 return FIREBASE_URL + '/' + currentAgent.id + '/' + key + '.json';
}

function setSync(state){
 var dot = document.getElementById('syncDot');
 var lbl = document.getElementById('syncLabel');
 if(!dot || !lbl) return;
 if(state === 'saving'){ dot.style.background = 'var(--amb)'; lbl.childNodes[1] && (lbl.childNodes[1].nodeValue = 'Saving...'); lbl.lastChild && (lbl.lastChild.nodeValue = 'Saving...'); lbl.innerHTML = '<span class="sync-dot" id="syncDot" style="background:var(--amb)"></span>Saving...'; }
 else if(state === 'error'){ lbl.innerHTML = '<span class="sync-dot" id="syncDot" style="background:#c0392b"></span>Error'; }
 else { lbl.innerHTML = '<span class="sync-dot" id="syncDot" style="background:var(--grn)"></span>Synced'; }
}

function fbSave(key, data){
 if(!currentAgent) return Promise.resolve();
 setSync('saving');
 return fetch(fbPath(key), {method:'PUT', body: JSON.stringify(data)})
  .then(function(r){ return r.json(); })
  .then(function(d){ setSync('synced'); return d; })
  .catch(function(e){ setSync('error'); console.error('fbSave error:', e); });
}

function fbLoad(key){
 if(!currentAgent) return Promise.resolve(null);
 return fetch(fbPath(key))
  .then(function(r){ return r.json(); })
  .catch(function(){ return null; });
}

function toggleLoginMode(){
 var lm = document.getElementById('loginMode');
 var rm = document.getElementById('registerMode');
 if(lm.style.display === 'none'){ lm.style.display = 'block'; rm.style.display = 'none'; }
 else { lm.style.display = 'none'; rm.style.display = 'block'; }
 document.getElementById('loginError').style.display = 'none';
 document.getElementById('regError').style.display = 'none';
}

async function doRegister(){
 var name = document.getElementById('reg_name').value.trim();
 var branch = document.getElementById('reg_branch').value.trim();
 var pin = document.getElementById('reg_pin').value.trim();
 var pin2 = document.getElementById('reg_pin2').value.trim();
 var errEl = document.getElementById('regError');

 if(!name || name.split(' ').length < 2){ errEl.textContent = 'Please enter your full name (first and last)'; errEl.style.display='block'; return; }
 if(!branch){ errEl.textContent = 'Please enter your branch'; errEl.style.display='block'; return; }
 if(!pin || pin.length < 4){ errEl.textContent = 'PIN must be at least 4 digits'; errEl.style.display='block'; return; }
 if(pin !== pin2){ errEl.textContent = 'PINs do not match'; errEl.style.display='block'; return; }

 var agentId = makeAgentId(name);
 try {
  var existing = await fetch(FIREBASE_URL + '/' + agentId + '/profile.json').then(function(r){return r.json();});
  if(existing && existing.name){
   errEl.textContent = 'An account with that name already exists. Please sign in.';
   errEl.style.display = 'block';
   return;
  }
 } catch(e){}

 var pinHash = await sha256(pin);
 var profile = { name: name, branch: branch, pin: pinHash, created: new Date().toISOString() };
 await fetch(FIREBASE_URL + '/' + agentId + '/profile.json', {method:'PUT', body: JSON.stringify(profile)});

 currentAgent = { id: agentId, name: name, branch: branch };
 sessionStorage.setItem('doi_agent', JSON.stringify(currentAgent));

 var remembered = JSON.parse(localStorage.getItem('doi_remembered_agents') || '[]');
 if(!remembered.find(function(a){return a.id===agentId})){
  remembered.push({id:agentId, name:name});
  localStorage.setItem('doi_remembered_agents', JSON.stringify(remembered));
 }

 await migrateLegacyLocalData();
 await loadAgentData();
 enterApp();
 showToast('Account created. Welcome, ' + name.split(' ')[0] + '!', 5000);
}

async function doLogin(){
 var name = document.getElementById('login_name').value.trim();
 var pin = document.getElementById('login_pin').value.trim();
 var errEl = document.getElementById('loginError');

 if(!name){ errEl.textContent = 'Please enter your name'; errEl.style.display='block'; return; }
 if(!pin){ errEl.textContent = 'Please enter your PIN'; errEl.style.display='block'; return; }

 var agentId = makeAgentId(name);
 try {
  var profile = await fetch(FIREBASE_URL + '/' + agentId + '/profile.json').then(function(r){return r.json();});
  if(!profile || !profile.name){
   errEl.textContent = 'No account found. Check your name or create a new account.';
   errEl.style.display = 'block';
   return;
  }
  var pinHash = await sha256(pin);
  if(pinHash !== profile.pin){
   errEl.textContent = 'Incorrect PIN. Please try again.';
   errEl.style.display = 'block';
   return;
  }
  currentAgent = { id: agentId, name: profile.name, branch: profile.branch };
  sessionStorage.setItem('doi_agent', JSON.stringify(currentAgent));

  var remembered = JSON.parse(localStorage.getItem('doi_remembered_agents') || '[]');
  if(!remembered.find(function(a){return a.id===agentId})){
   remembered.push({id:agentId, name:profile.name});
   localStorage.setItem('doi_remembered_agents', JSON.stringify(remembered));
  }

  await migrateLegacyLocalData();
  await loadAgentData();
  enterApp();
  showToast('Welcome back, ' + profile.name.split(' ')[0] + '!', 4000);
 } catch(e){
  console.error('Login error:', e);
  errEl.textContent = 'Connection error: ' + (e.message || e);
  errEl.style.display = 'block';
 }
}

function doLogout(){
 sessionStorage.removeItem('doi_agent');
 currentAgent = null;
 document.getElementById('appShell').style.display = 'none';
 document.getElementById('loginScreen').style.display = 'flex';
 document.getElementById('login_pin').value = '';
}

function enterApp(){
 document.getElementById('loginScreen').style.display = 'none';
 document.getElementById('appShell').style.display = 'block';
 document.getElementById('topAgentInfo').textContent = currentAgent.name + ' | ' + currentAgent.branch;
 setSync('synced');
 renderCDConversion();
 loadFeedback().catch(function(e){ console.error('Feedback load error:', e); });
}

// ═══════════════════════════════════════════════════
// FEEDBACK SYSTEM
// ═══════════════════════════════════════════════════
var feedbackItems = [];
var nextFbId = 1;

function isAdmin(){
 return currentAgent && currentAgent.id === 'steve_maxim';
}

function fbFeedbackPath(id){
 return FIREBASE_URL + '/_feedback' + (id ? '/' + id : '') + '.json';
}

function fbSaveFeedback(item){
 setSync('saving');
 return fetch(fbFeedbackPath(item.id), {method:'PUT', body: JSON.stringify(item)})
  .then(function(r){ return r.json(); })
  .then(function(d){ setSync('synced'); return d; })

// One-time migration: if legacy (un-prefixed) keys exist and per-agent keys don't,
// copy them into this agent's namespace. Runs on first login/register only.
async function migrateLegacyLocalData(){
 if(!currentAgent) return;
 var id = currentAgent.id;
 var pairs = [
  ['cd_illustration_rates', 'doi_cd_rates_' + id],
  ['cd_yearly_rates', 'doi_cd_yearly_rates_' + id],
  ['ava_illustration_rates', 'doi_ava_rates_' + id],
  ['annuity_features', 'doi_annuity_features_' + id],
  ['duet_idx_inputs2', 'doi_idx_inputs_' + id]
 ];
 var migrated = false;
 pairs.forEach(function(p){
  var legacy = localStorage.getItem(p[0]);
  var current = localStorage.getItem(p[1]);
  if(legacy && !current){
   localStorage.setItem(p[1], legacy);
   migrated = true;
  }
 });
 if(migrated){
  // Push migrated data to Firebase
  try {
   await fbSave('cd_illustration_rates', JSON.parse(localStorage.getItem('doi_cd_rates_'+id) || '{}'));
   await fbSave('cd_yearly_rates', JSON.parse(localStorage.getItem('doi_cd_yearly_rates_'+id) || '{}'));
   await fbSave('ava_illustration_rates', JSON.parse(localStorage.getItem('doi_ava_rates_'+id) || '{}'));
   await fbSave('annuity_features', JSON.parse(localStorage.getItem('doi_annuity_features_'+id) || '{}'));
   await fbSave('duet_idx_inputs2', JSON.parse(localStorage.getItem('doi_idx_inputs_'+id) || 'null'));
  } catch(e){ console.error('Migration push error:', e); }
 }
}

function runScenario(amt, spPct, bondPct, annPct, wdRate, fee, capRate, capBonus, parRate, startYear, startAge){
 var spBal = amt*(spPct/100), bondBal = amt*(bondPct/100), annBal = amt*(annPct/100);
 annBal = annBal * (1 + capBonus);
 var wdAmt = amt*(wdRate/100);
 var rows = [];
 var protectedYears = 0, totalLoss = 0;
 rows.push({year:0,calYear:startYear,age:startAge,spBal:spBal,bondBal:bondBal,annBal:annBal,total:spBal+bondBal+annBal,spRate:0,bondRate:0,annCredited:0,wd:0});
 for(var i=1;i<=20;i++){
  var calYear = startYear+i;
  var data = SP_RETURNS[calYear];
  if(!data) break;
  var spR = data.sp, bondR = data.bond;
  // S&P bucket
  spBal = spBal*(1+spR-fee);
  // Bond bucket
  bondBal = bondBal*(1+bondR-fee);
  // Annuity bucket: cap
  var annCredited = Math.min(Math.max(spR,0),capRate);
  annBal = annBal*(1+annCredited);
  // Withdrawal proportionally
  var total = spBal+bondBal+annBal;
  if(total > 0 && wdAmt > 0){
   var wdActual = Math.min(wdAmt, total);
   var ratio = wdActual/total;
   spBal -= spBal*ratio;
   bondBal -= bondBal*ratio;
   annBal -= annBal*ratio;
  }
  if(spBal<0) spBal=0; if(bondBal<0) bondBal=0; if(annBal<0) annBal=0;
  if(spR<0){ protectedYears++; totalLoss+=spR; }
  rows.push({year:i,calYear:calYear,age:startAge+i,spBal:spBal,bondBal:bondBal,annBal:annBal,total:spBal+bondBal+annBal,spRate:spR,bondRate:bondR,annCredited:annCredited,wd:wdAmt});
 }
 return {rows:rows, protectedYears:protectedYears, totalLoss:totalLoss};
}

 // ═══ PIE CHARTS — Both Scenarios ═══
 function drawDonut(areaId, title, titleColor, slices){
  setTimeout(function(){
   var area = document.getElementById(areaId);
   if(!area || slices.length===0) return;
   var canvasId = areaId+'_canvas', legendId = areaId+'_legend';
   var ph = '<div style="font-size:11px;font-weight:700;color:'+titleColor+';margin-bottom:6px;text-align:center">'+title+'</div>';
   ph += '<canvas id="'+canvasId+'" width="180" height="180" style="max-width:180px"></canvas>';
   ph += '<div id="'+legendId+'" style="font-size:11px;line-height:1.9;margin-top:6px"></div>';
   area.innerHTML = ph;
   var canvas = document.getElementById(canvasId);
   if(!canvas) return;
   var ctx = canvas.getContext('2d');
   var total = slices.reduce(function(s,sl){return s+sl.value},0);
   var cx=90,cy=90,radius=78,startAngle=-Math.PI/2;
   slices.forEach(function(sl){
    var sliceAngle=(sl.value/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,startAngle,startAngle+sliceAngle); ctx.closePath();
    ctx.fillStyle=sl.color; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    var midAngle=startAngle+sliceAngle/2; var pct=((sl.value/total)*100).toFixed(0);
    if(pct>=10){
     ctx.fillStyle='#fff'; ctx.font='bold 12px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
     ctx.fillText(pct+'%',cx+Math.cos(midAngle)*(radius*0.6),cy+Math.sin(midAngle)*(radius*0.6));
    }
    startAngle+=sliceAngle;
   });
   ctx.beginPath(); ctx.arc(cx,cy,36,0,Math.PI*2);
   var isDark=document.body.classList.contains('dark-mode');
   ctx.fillStyle=isDark?'#242440':'#fff'; ctx.fill();
   ctx.fillStyle=isDark?'#e8e8f0':'#222'; ctx.font='bold 12px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
   ctx.fillText(fmtK(total),cx,cy-5);
   ctx.font='8px system-ui,sans-serif'; ctx.fillStyle=isDark?'#9999aa':'#666'; ctx.fillText('TOTAL',cx,cy+8);
   var lh='';
   slices.forEach(function(sl){
    lh+='<div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:12px;border-radius:3px;background:'+sl.color+';flex-shrink:0"></div>';
    lh+='<span><b style="color:'+sl.color+'">'+fmtK(sl.value)+'</b> <span style="color:var(--muted)">('+((sl.value/total)*100).toFixed(1)+'%)</span> '+sl.label+'</span></div>';
   });
   document.getElementById(legendId).innerHTML=lh;
  },0);
 }

 // Scenario A slices
 var slicesA = [];
 if(lastA.spBal>0) slicesA.push({label:'S&P 500',value:lastA.spBal,color:'#e74c3c'});
 if(lastA.bondBal>0) slicesA.push({label:'Bonds',value:lastA.bondBal,color:'#2980b9'});
 drawDonut('idxPieAreaA','Scenario A Breakdown','#e74c3c',slicesA);

 // Scenario B slices
 var slicesB = [];
 if(lastB.spBal>0) slicesB.push({label:'S&P 500',value:lastB.spBal,color:'#e74c3c'});
 if(lastB.bondBal>0) slicesB.push({label:'Bonds',value:lastB.bondBal,color:'#2980b9'});
 if(lastB.annBal>0) slicesB.push({label:'Annuity',value:lastB.annBal,color:'#1D9E75'});
 drawDonut('idxPieAreaB','Scenario B Breakdown','#1D9E75',slicesB);
}





function emailIndexReport(){
 var d = idxInputs;
 var sA = window._scenA, sB = window._scenB;
 if(!sA||!sB){ showToast('Run the projection first'); return; }
 var lastA = sA.rows[sA.rows.length-1], lastB = sB.rows[sB.rows.length-1];
 var projYears = sA.rows.length-1;
 var diff = lastB.total - lastA.total;
 var fmtK = function(n){return '$'+Math.round(n).toLocaleString()};

 var plain = 'S&P vs Annuity — Two-Scenario Comparison\nPrepared for: '+(d.clientName||'Client')+'\n\n';
 plain += 'Total Investment: '+fmtK(d.amount)+' | '+d.startYear+'–'+(d.startYear+projYears)+' ('+projYears+' years, actual historical data)\n\n';
 plain += '━━ Scenario A — All Market ━━\n';
 plain += 'Allocation: '+d.aSpPct+'% S&P / '+d.aBondPct+'% Bonds | Withdrawal: '+d.aWdRate+'%/yr\n';
 plain += 'Ending Balance: '+fmtK(lastA.total)+'\n\n';
 plain += '━━ Scenario B — Market + Annuity ━━\n';
 plain += 'Allocation: '+d.bSpPct+'% S&P / '+d.bBondPct+'% Bonds / '+d.bAnnPct+'% Annuity | Withdrawal: '+d.bWdRate+'%/yr\n';
 plain += 'Cap Rate: '+d.capRate+'% | Mgmt Fee: '+d.mgmtFee+'%\n';
 plain += 'Ending Balance: '+fmtK(lastB.total)+'\n\n';
 if(diff>=0) plain += '✅ Scenario B produces '+fmtK(diff)+' MORE than all-market\n';
 else plain += 'Scenario A produces '+fmtK(Math.abs(diff))+' more — but with 100% market risk\n';
 plain += '🛡️ '+sB.protectedYears+' down years where the annuity floor protected your money (0% vs market losses)\n';
 plain += '\n— '+(currentAgent?currentAgent.name:'Agent')+' | AAA Life Specialist\nGenerated by DuetIncome';

 var subject = encodeURIComponent('S&P vs Annuity Comparison — '+(d.clientName||'Client'));
 var gmailUrl = 'https://mail.google.com/mail/?view=cm&fs=1&su='+subject+'&body='+encodeURIComponent(plain.substring(0,1500));
 window.open(gmailUrl, '_blank');
}

function copyTalkingPoints(){
 var el = document.getElementById('idxTalkingPts');
 if(!el){ showToast('Run the projection first', 3000); return; }
 // Extract just the text content from the talking points
 var cloned = el.cloneNode(true);
 // Remove the copy button itself
 var btns = cloned.querySelectorAll('button');
 btns.forEach(function(b){b.remove()});
 // Get clean text
 var text = cloned.innerText.replace(/\n{3,}/g,'\n\n').trim();
 // Also build HTML version
 var htmlContent = cloned.innerHTML;
 var blob = new Blob([htmlContent], {type:'text/html'});
 var item = new ClipboardItem({'text/html': blob, 'text/plain': new Blob([text], {type:'text/plain'})});
 navigator.clipboard.write([item]).then(function(){
  showToast('✅ Talking points copied! Paste into email or notes.', 5000);
 }).catch(function(){
  // Fallback to plain text
  navigator.clipboard.writeText(text).then(function(){
   showToast('✅ Talking points copied as text!', 5000);
  });
 });
}
